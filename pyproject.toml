[project]
name = "loady"
version = "1.9.0"
description = "🛍 Load Python code and data from git 🛍"
authors = [{ name = "Tom Ritchford", email = "tom@swirly.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = [
    "wheel>=0.38.4,<0.39",
    "gitpython>=3.1.30,<4",
    "beautifulsoup4>=4.11.1,<5",
    "requests>=2.28.2,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "coverage>=7.13.2",
    "flake8==5.0.4",
    "pytest>=7.2.1,<8",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.14",
    "ty>=0.0.14",
]

[tool.coverage]

[tool.ruff.format]
quote-style = "single"

[tool.poetry]
name = "loady"
version = "0.1.0"
description = "🛍 Load Python code and data from git 🛍"
authors = ["Tom Ritchford <tom@swirly.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
